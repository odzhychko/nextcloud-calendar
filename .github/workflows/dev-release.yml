# Creates a pre-release with the packed npm package for every push to main of the fork,
# so other repositories can depend on it by tarball URL before it is published to npm.

name: Dev release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Run one release at a time, so two runs never pick the same number
concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  release:
    # Only in the fork, never upstream
    if: github.repository == 'odzhychko/nextcloud-calendar'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package.json node and npm engines version
        uses: nextcloud-libraries/parse-package-engines-action@39fcc545a815c353dd0a3fd8fd2ef6e59fd02b92 # v0.2.0
        id: versions

      - name: Set up node ${{ steps.versions.outputs.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node-version }}

      - name: Set up npm ${{ steps.versions.outputs.package-manager-version }}
        run: npm i -g 'npm@${{ steps.versions.outputs.package-manager-version }}'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run ts:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set dev version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(node -p "require('./package.json').version")"
          prefix="v${base}-dev."
          last="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$prefix" \
            --jq ".[].ref | ltrimstr(\"refs/tags/$prefix\") | select(test(\"^[0-9]+$\")) | tonumber" \
            | sort -n | tail -n 1)"
          next=1
          if [ -n "$last" ]; then next=$(( last + 1 )); fi
          version="${base}-dev.${next}"
          npm version --no-git-tag-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Development build of $GITHUB_SHA" \
            --prerelease
